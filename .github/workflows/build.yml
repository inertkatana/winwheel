name: Build WinWheel

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Compile WinWheel executable
      run: |
        cl.exe /nologo /O2 /MD /Fe:winwheel.exe winwheel.c /link /SUBSYSTEM:WINDOWS

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: winwheel-exe
        path: winwheel.exe

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: winwheel.exe
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
